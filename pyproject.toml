[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussian-beam-optics"
version = "0.1.0"
description = "Paraxial ABCD ray optics and Gaussian-beam propagation"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Luis Rodriguez" }]
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
notebooks = ["matplotlib", "jupyter"]

[tool.setuptools]
packages = ["beamprop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
